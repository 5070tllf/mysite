<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的全能资源库</title>
    <style>
        /* ================= 基础重置 ================= */
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* ================= 绝美动态背景 ================= */
        body {
            background-color: #f0f4f8;
            color: #1a202c;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding-bottom: 50px;
        }

        .bg-blob {
            position: fixed; border-radius: 50%; filter: blur(80px); z-index: -1;
            opacity: 0.6; animation: float 10s infinite alternate ease-in-out;
        }
        .blob-1 { width: 300px; height: 300px; background: #a78bfa; top: -50px; left: -100px; }
        .blob-2 { width: 250px; height: 250px; background: #60a5fa; top: 40%; right: -100px; animation-delay: -5s; }
        .blob-3 { width: 200px; height: 200px; background: #fbcfe8; bottom: -50px; left: 20%; animation-delay: -2s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        .container { max-width: 500px; margin: 0 auto; padding: 20px; }

        /* ================= 头部 ================= */
        .header { text-align: center; padding: 30px 20px 20px; }
        .avatar {
            width: 80px; height: 80px; margin: 0 auto 15px;
            background: linear-gradient(135deg, #ffffff, #f0f0f0);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 35px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        .header h1 { font-size: 24px; font-weight: 800; color: #1e293b; letter-spacing: 1px; }

        /* ================= 吸顶分类导航 ================= */
        .nav-tabs {
            position: sticky; top: 15px; z-index: 100;
            display: flex; gap: 10px; overflow-x: auto; padding: 5px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 25px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.5); margin-bottom: 30px;
            -webkit-overflow-scrolling: touch; scroll-behavior: smooth;
        }
        .nav-tabs::-webkit-scrollbar { display: none; }
        .nav-tabs a {
            text-decoration: none; padding: 10px 20px; color: #475569; font-size: 15px; font-weight: 600;
            white-space: nowrap; border-radius: 20px; transition: all 0.3s;
        }
        .nav-tabs a:hover, .nav-tabs a:active { background: #ffffff; color: #4f46e5; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

        /* ================= 内容分区 ================= */
        .section { margin-bottom: 40px; scroll-margin-top: 80px; }
        .section-title {
            font-size: 18px; font-weight: 800; color: #1e293b;
            margin-bottom: 15px; display: flex; align-items: center; gap: 8px; padding-left: 5px;
        }

        /* ================= 双列网格排版（适合大量网站） ================= */
        .grid-container {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
        }

        .card {
            display: flex; flex-direction: column; align-items: center; text-align: center;
            padding: 18px 10px; text-decoration: none;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 18px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        }

        .card:hover, .card:active {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            background: #ffffff;
        }

        .card-icon {
            width: 45px; height: 45px; display: flex; justify-content: center; align-items: center;
            font-size: 22px; border-radius: 12px; margin-bottom: 10px; background: #f8fafc;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.8), 0 2px 5px rgba(0,0,0,0.05);
        }

        /* 图标底色微调 */
        .icon-game { background: #e0e7ff; color: #4338ca; }
        .icon-anime { background: #fce7f3; color: #db2777; }
        .icon-movie { background: #e0f2fe; color: #0284c7; }

        .card-title { font-size: 14px; font-weight: 700; color: #1e293b; line-height: 1.2; }

    </style>
</head>
<body>

    <!-- 背景光球 -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <div class="container">
        
        <!-- 头部 -->
        <div class="header">
            <div class="avatar">🎮</div>
            <h1>全能娱乐中心</h1>
        </div>

        <!-- 吸顶导航 -->
        <div class="nav-tabs">
            <a href="#games">🎮 小游戏</a>
            <a href="#anime">📺 动漫追番</a>
            <a href="#movies">🎬 影视追剧</a>
        </div>

        <!-- ================= 1. 小游戏区 ================= -->
        <div class="section" id="games">
            <div class="section-title">🎮 免登录小游戏</div>
            <div class="grid-container">
                
                <a href="https://poki.com/zh" target="_blank" class="card">
                    <div class="card-icon icon-game">🕹️</div>
                    <div class="card-title">Poki 游戏</div>
                </a>

                <a href="https://www.crazygames.com/" target="_blank" class="card">
                    <div class="card-icon icon-game">🤪</div>
                    <div class="card-title">CrazyGames</div>
                </a>

                <a href="https://u.ali213.net/" target="_blank" class="card">
                    <div class="card-icon icon-game">⚔️</div>
                    <div class="card-title">游侠小游戏</div>
                </a>

                <a href="https://cn.pigame.cc/" target="_blank" class="card">
                    <div class="card-icon icon-game">🐷</div>
                    <div class="card-title">小猪秒玩</div>
                </a>

                <a href="https://gamer.qq.com/" target="_blank" class="card">
                    <div class="card-icon icon-game">🐧</div>
                    <div class="card-title">腾讯云游戏</div>
                </a>

            </div>
        </div>

        <!-- ================= 2. 动漫区 ================= -->
        <div class="section" id="anime">
            <div class="section-title">📺 动漫追番</div>
            <div class="grid-container">
                
                <a href="https://www.acfun.cn/" target="_blank" class="card">
                    <div class="card-icon icon-anime">📺</div>
                    <div class="card-title">AcFun (A站)</div>
                </a>

                <a href="https://www.agedm.io/" target="_blank" class="card">
                    <div class="card-icon icon-anime">👴</div>
                    <div class="card-title">AGE动漫</div>
                </a>

                <a href="https://jciyuan.com/" target="_blank" class="card">
                    <div class="card-icon icon-anime">😆</div>
                    <div class="card-title">囧次元</div>
                </a>

                <a href="https://omofun.link" target="_blank" class="card">
                    <div class="card-icon icon-anime">🦄</div>
                    <div class="card-title">OmoFun</div>
                </a>

                <a href="https://dm.xifanacg.com/" target="_blank" class="card">
                    <div class="card-icon icon-anime">🥣</div>
                    <div class="card-title">稀饭动漫</div>
                </a>

                <a href="https://www.mutedm.com/" target="_blank" class="card">
                    <div class="card-icon icon-anime">🤐</div>
                    <div class="card-title">MuteFun</div>
                </a>

            </div>
        </div>

        <!-- ================= 3. 影视区 ================= -->
        <div class="section" id="movies">
            <div class="section-title">🎬 影视追剧</div>
            <div class="grid-container">
                
                <a href="https://www.5ggtv.com/" target="_blank" class="card">
                    <div class="card-icon icon-movie">🎥</div>
                    <div class="card-title">5GGTV</div>
                </a>

                <a href="https://www.freeok.mobi/" target="_blank" class="card">
                    <div class="card-icon icon-movie">🆓</div>
                    <div class="card-title">FreeOK</div>
                </a>

                <a href="https://www.kkys02.com/" target="_blank" class="card">
                    <div class="card-icon icon-movie">🍫</div>
                    <div class="card-title">可可影视</div>
                </a>

                <a href="https://v.ikanbot.com/" target="_blank" class="card">
                    <div class="card-icon icon-movie">🤖</div>
                    <div class="card-title">爱看机器人</div>
                </a>

                <a href="https://www.ixigua.com/channel/anime/" target="_blank" class="card">
                    <div class="card-icon icon-movie">🍉</div>
                    <div class="card-title">西瓜视频</div>
                </a>

                <a href="https://www.bilibili.com" target="_blank" class="card">
                    <div class="card-icon icon-movie">🌸</div>
                    <div class="card-title">哔哩哔哩</div>
                </a>

            </div>
        </div>

    </div>

</body>
</html>
