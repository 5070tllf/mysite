<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的主页</title>
    <style>
        /* ================= 基础重置 ================= */
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* ================= 梦幻极光背景 ================= */
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(120deg, #f6d365 0%, #fda085 50%, #f6d365 100%);
            background-size: 200% 200%;
            animation: auroraBG 15s ease infinite;
            padding: 20px;
            overflow: hidden;
        }

        @keyframes auroraBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ================= 核心容器 ================= */
        .app-container { 
            width: 100%; 
            max-width: 380px; 
            height: 650px; 
            position: relative; 
            perspective: 1000px; /* 开启 3D 空间 */
        }

        /* ================= 页面卡片通用样式（毛玻璃） ================= */
        .page {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 35px;
            padding: 40px 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            display: flex; flex-direction: column;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); /* Q弹的动画曲线 */
            transform-origin: center center;
        }

        /* ================= 界面 1：名片 ================= */
        #page1 { z-index: 2; transform: translateX(0) scale(1); opacity: 1; }
        /* 飞走时的状态 */
        #page1.slide-out { 
            transform: translateX(-30%) scale(0.8) rotateY(-20deg); 
            opacity: 0; 
            pointer-events: none; 
        }

        /* 头像（带高级质感） */
        .avatar-wrap {
            width: 100px; height: 100px; margin: 10px auto 20px; position: relative;
        }
        .avatar-wrap::after {
            content: ''; position: absolute; top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 50%; background: linear-gradient(45deg, #ff9a9e, #fecfef, #a18cd1);
            z-index: -1; filter: blur(10px); opacity: 0.8; animation: pulseGlow 3s infinite alternate;
        }
        @keyframes pulseGlow { 0% { opacity: 0.5; } 100% { opacity: 1; } }
        .avatar {
            width: 100%; height: 100%; border-radius: 50%;
            background: white; display: flex; justify-content: center; align-items: center;
            font-size: 45px; box-shadow: inset 0 -3px 10px rgba(0,0,0,0.05);
        }

        h1 { font-size: 26px; color: #2c3e50; margin-bottom: 8px; font-weight: 800; letter-spacing: 0.5px; }
        .subtitle { font-size: 14px; color: #7f8c8d; margin-bottom: 25px; font-weight: 500; }
        .bio { font-size: 15px; color: #555; line-height: 1.7; margin-bottom: 20px; flex-grow: 1; text-align: center; }

        /* ================= 按钮通用样式 ================= */
        .btn-primary {
            width: 100%; padding: 18px; border-radius: 18px; border: none;
            font-size: 17px; font-weight: 700; color: white; cursor: pointer;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 10px 25px rgba(118, 75, 162, 0.4);
            transition: all 0.3s ease; margin-top: auto;
        }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(118, 75, 162, 0.5); }
        .btn-primary:active { transform: scale(0.96); }

        /* ================= 界面 2：导航中心 ================= */
        #page2 { 
            z-index: 1; 
            transform: translateX(100%) scale(0.9); 
            opacity: 0; 
        }
        /* 出现时的状态 */
        #page2.slide-in { 
            transform: translateX(0) scale(1); 
            opacity: 1; 
            z-index: 3; 
        }

        /* 头部导航栏 */
        .nav-header { display: flex; align-items: center; margin-bottom: 25px; }
        .back-btn {
            width: 40px; height: 40px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.8); color: #333; font-size: 20px;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.3s;
        }
        .back-btn:hover { background: white; transform: scale(1.1); }
        .nav-title { flex-grow: 1; text-align: center; font-size: 20px; font-weight: 800; color: #2c3e50; padding-right: 40px; }

        /* 导航列表 */
        .nav-list { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; padding: 5px; }
        
        .nav-item {
            display: flex; align-items: center; padding: 16px 20px; text-decoration: none;
            background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(255,255,255,0.5);
            border-radius: 20px; color: #2c3e50; font-weight: 600; font-size: 16px; 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .nav-item:hover { 
            background: white; 
            transform: translateY(-3px) scale(1.02); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.08); 
            color: #764ba2;
        }
        .nav-icon { 
            font-size: 20px; margin-right: 15px; 
            background: rgba(118, 75, 162, 0.1); padding: 8px; border-radius: 12px;
        }
        
        /* 隐藏滚动条 */
        .nav-list::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- ================= 界面 1 ================= -->
        <div class="page" id="page1">
            <div class="avatar-wrap">
                <!-- 想换头像可以改这里的 Emoji -->
                <div class="avatar">👨‍💻</div>
            </div>
            <!-- 改名字 -->
            <h1>我的同学</h1>
            <!-- 改简介头衔 -->
            <div class="subtitle">Designer & Developer</div>
            
            <p class="bio">
                欢迎来到我的专属空间。<br>
                这是一个基于全新技术构建的个人主页。<br>
                点击下方按钮，开启探索之旅。
            </p>
            
            <!-- 进入按钮 -->
            <button class="btn-primary" onclick="goToPage2()">进入传送门 🚀</button>
        </div>

        <!-- ================= 界面 2 ================= -->
        <div class="page" id="page2">
            <div class="nav-header">
                <button class="back-btn" onclick="goToPage1()">←</button>
                <div class="nav-title">我的收藏</div>
            </div>
            
            <div class="nav-list">
                <!-- 导航链接列表（修改 href="里面的网址" 即可） -->
                <a href="https://www.bilibili.com" target="_blank" class="nav-item">
                    <span class="nav-icon">📺</span> 哔哩哔哩 (B站)
                </a>
                
                <a href="https://github.com/5070tlf" target="_blank" class="nav-item">
                    <span class="nav-icon">🐱</span> 我的 GitHub
                </a>
                
                <a href="https://www.zhihu.com" target="_blank" class="nav-item">
                    <span class="nav-icon">💡</span> 知乎
                </a>
                
                <a href="https://www.douyin.com" target="_blank" class="nav-item">
                    <span class="nav-icon">🎵</span> 抖音
                </a>
                
                <a href="https://music.163.com" target="_blank" class="nav-item">
                    <span class="nav-icon">🎧</span> 网易云音乐
                </a>
            </div>
        </div>

    </div>

    <!-- 页面切换脚本 -->
    <script>
        const page1 = document.getElementById('page1');
        const page2 = document.getElementById('page2');

        // 进入第二页
        function goToPage2() {
            page1.classList.add('slide-out');
            page2.classList.add('slide-in');
        }

        // 返回第一页
        function goToPage1() {
            page1.classList.remove('slide-out');
            page2.classList.remove('slide-in');
        }
    </script>
</body>
</html>
