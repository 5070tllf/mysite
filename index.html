<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>洪其灏网页导航</title>
    <style>
        /* ================= 基础重置 ================= */
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* ================= 极简动态背景 ================= */
        body {
            background-color: #f0f4f8;
            color: #1a202c;
            min-height: 100vh;
            position: relative;
            padding-bottom: 50px;
            scroll-behavior: smooth; 
        }

        /* 去掉了容易卡顿的模糊光球，改用极简背景色 */
        .bg-color {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            opacity: 0.4;
        }

        .container { max-width: 500px; margin: 0 auto; padding: 20px; }

        /* ================= 头部 ================= */
        .header { text-align: center; padding: 30px 20px 20px; }
        .avatar {
            width: 80px; height: 80px; margin: 0 auto 15px;
            background: #ffffff;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 35px; box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        .header h1 { font-size: 24px; font-weight: 800; color: #1e293b; letter-spacing: 1px; }

        /* ================= 吸顶分类导航 ================= */
        .nav-tabs {
            position: sticky; top: 15px; z-index: 100;
            display: flex; gap: 10px; overflow-x: auto; padding: 8px;
            background: rgba(255, 255, 255, 0.95); /* 提高不透明度防止渲染出错 */
            border-radius: 25px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.5); margin-bottom: 30px;
            -webkit-overflow-scrolling: touch;
        }
        .nav-tabs::-webkit-scrollbar { display: none; }
        .nav-tabs a {
            text-decoration: none; padding: 10px 20px; color: #475569; font-size: 15px; font-weight: 600;
            white-space: nowrap; border-radius: 20px; transition: all 0.2s;
        }
        .nav-tabs a:hover, .nav-tabs a:active { background: #e2e8f0; color: #4f46e5; }

        /* ================= 内容分区 ================= */
        .section { margin-bottom: 40px; scroll-margin-top: 80px; }
        .section-title {
            font-size: 18px; font-weight: 800; color: #1e293b;
            margin-bottom: 15px; display: flex; align-items: center; gap: 8px; padding-left: 5px;
        }

        /* ================= 双列网格排版 ================= */
        .grid-container {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
        }

        .card {
            display: flex; flex-direction: column; align-items: center; text-align: center;
            padding: 18px 10px; text-decoration: none;
            background: #ffffff; /* 去掉毛玻璃，使用纯色卡片，绝对不卡 */
            border-radius: 18px; border: 1px solid #f1f5f9;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
            cursor: pointer; /* 确保手指点上去有指针反馈 */
        }

        .card:hover, .card:active {
            transform: scale(0.96); /* 按下去的缩放反馈，更真实 */
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .card-icon {
            width: 45px; height: 45px; display: flex; justify-content: center; align-items: center;
            font-size: 22px; border-radius: 12px; margin-bottom: 10px; background: #f8fafc;
            font-weight: bold;
        }

        /* 图标底色 */
        .icon-game { background: #e0e7ff; color: #4338ca; }
        .icon-anime { background: #fce7f3; color: #db2777; }
        .icon-movie { background: #e0f2fe; color: #0284c7; }
        .icon-nb { background: #fee2e2; color: #dc2626; }
        .icon-mat { background: #dcfce7; color: #16a34a; }

        .card-title { font-size: 14px; font-weight: 700; color: #1e293b; line-height: 1.2; }

    </style>
</head>
<body>

    <div class="bg-color"></div>

    <!-- 强力防拦截跳转脚本 -->
    <script>
        // 用 JS 强制接管所有的点击事件，无视系统的安全拦截
        document.querySelectorAll('.card').forEach(function(card) {
            card.addEventListener('click', function(e) {
                e.preventDefault(); // 阻止默认的跳转行为
                var targetUrl = this.getAttribute('href');
                if(targetUrl && targetUrl !== '#') {
                    window.location.href = targetUrl; // 强制在当前页跳转
                }
            });
        });
    </script>

</body>
</html>
