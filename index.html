<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的主页</title>
    <style>
        /* 基础重置 */
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* 梦幻极光背景 */
        body {
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            background: linear-gradient(120deg, #f6d365 0%, #fda085 50%, #f6d365 100%);
            background-size: 200% 200%;
            animation: auroraBG 15s ease infinite;
            padding: 40px 20px;
        }

        @keyframes auroraBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 主卡片 */
        .glass-card {
            width: 100%; max-width: 400px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 35px;
            padding: 40px 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            text-align: center;
            margin-bottom: 30px;
        }

        /* 头像光晕 */
        .avatar-wrap { width: 100px; height: 100px; margin: 0 auto 20px; position: relative; }
        .avatar-wrap::after {
            content: ''; position: absolute; top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 50%; background: linear-gradient(45deg, #ff9a9e, #fecfef, #a18cd1);
            z-index: -1; filter: blur(10px); opacity: 0.8; animation: pulseGlow 3s infinite alternate;
        }
        @keyframes pulseGlow { 0% { opacity: 0.5; } 100% { opacity: 1; } }
        .avatar {
            width: 100%; height: 100%; border-radius: 50%;
            background: white; display: flex; justify-content: center; align-items: center;
            font-size: 45px; box-shadow: inset 0 -3px 10px rgba(0,0,0,0.05);
        }

        h1 { font-size: 26px; color: #2c3e50; margin-bottom: 8px; font-weight: 800; }
        .subtitle { font-size: 14px; color: #7f8c8d; margin-bottom: 20px; font-weight: 500; }
        .bio { font-size: 15px; color: #555; line-height: 1.7; }

        /* 导航区域标题 */
        .nav-title { font-size: 20px; font-weight: 800; color: #2c3e50; margin-bottom: 20px; text-shadow: 0 2px 5px rgba(255,255,255,0.8);}

        /* 导航列表 */
        .nav-list { 
            width: 100%; max-width: 400px; 
            display: flex; flex-direction: column; gap: 15px; 
        }
        
        .nav-item {
            display: flex; align-items: center; padding: 16px 20px; text-decoration: none;
            background: rgba(255, 255, 255, 0.8); border: 1px solid rgba(255,255,255,0.5);
            border-radius: 20px; color: #2c3e50; font-weight: 700; font-size: 16px; 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        
        .nav-item:hover { 
            background: white; 
            transform: translateY(-3px) scale(1.02); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); 
            color: #764ba2;
        }
        
        .nav-icon { 
            font-size: 20px; margin-right: 15px; 
            background: rgba(118, 75, 162, 0.1); padding: 8px; border-radius: 12px;
        }
    </style>
</head>
<body>

    <!-- 个人信息卡片 -->
    <div class="glass-card">
        <div class="avatar-wrap">
            <div class="avatar">👨‍💻</div>
        </div>
        <h1>不会英文会写外挂的我</h1>
        <div class="subtitle">Designer & Developer</div>
        <p class="bio">
            欢迎来到我的网页跳转神器<br>
            点击下方列表，快速访问我的常用网站。
        </p>
    </div>

    <!-- 导航列表 -->
    <div class="nav-title">前往</div>
    
    <div class="nav-list">
        <!-- 如果点击没反应，请确保网址以 https:// 开头 -->
        <a href="https://www.bilibili.com" target="_blank" class="nav-item">
            <span class="nav-icon">📺</span> 哔哩哔哩 (B站)
        </a>
        
        <a href="https://github.com/5070tlf" target="_blank" class="nav-item">
            <span class="nav-icon">🐱</span> 我的 GitHub 主页
        </a>
        
        <a href="https://www.zhihu.com" target="_blank" class="nav-item">
            <span class="nav-icon">💡</span> 知乎
        </a>
        
        <a href="https://www.douyin.com" target="_blank" class="nav-item">
            <span class="nav-icon">🎵</span> 抖音
        </a>
        
        <a href="https://music.163.com" target="_blank" class="nav-item">
            <span class="nav-icon">🎧</span> 网易云音乐
        </a>
        
        <a href="https://youtude.com" target="_blank" class="nav-item">
            <span class="nav-icon">🤫</span> youtube
        </a>
        
        <a href="https://www.blockaway.net" target="_blank" class="nav-item">
            <span class="nav-icon">🤫</span> 被禁止网站开启神器
        </a>

    </div>

</body>
</html>
